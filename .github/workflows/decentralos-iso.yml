name: DecentralOS ISO

# Builds the installable DecentralOS ISO from the rebranded `main` branch of
# Decentral-America/DecentralOS, with the DecentralChain node in the bundled
# offline mirror. Download the result from the run's artifacts.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af >/dev/null
          df -h / | tail -1
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: Decentral-America/DecentralOS
          ref: main
          path: omarchy-src
      - uses: actions/checkout@v4
        with:
          repository: omacom/omarchy-pkgs
          path: omarchy-pkgs
      - name: Build the ISO
        run: NO_BOOT_OFFER=1 ./bin/omarchy-iso-make --no-cache --local-source omarchy-src omarchy-pkgs
      - name: Rename
        run: |
          cd release
          iso=$(ls -t *.iso | head -n1)
          mv "$iso" "decentralos-$(date +%Y%m%d).iso"
          sha256sum decentralos-*.iso | tee decentralos.sha256
          ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: decentralos-iso
          path: release/decentralos*
          compression-level: 0
          retention-days: 30
      # Installs the ISO unattended in a VM and boots the result, so an image
      # that cannot install is caught here instead of on real hardware.
      - name: Install test
        run: |
          sudo chmod 0666 /dev/kvm
          docker run --rm --device /dev/kvm -v "$PWD:/w" -w /w \
            -e OMARCHY_INTEGRATION_DISK_CACHE=none \
            ghcr.io/archlinux/archlinux:latest bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed qemu-system-x86 qemu-hw-display-virtio-gpu qemu-hw-display-virtio-vga qemu-img edk2-ovmf socat \
                imagemagick tesseract tesseract-data-eng mtools dosfstools jq openssh openssl python curl binutils >/dev/null
              printf "#!/bin/sh\nexit 0\n" >/usr/local/bin/omarchy-pkg-add
              chmod 0755 /usr/local/bin/omarchy-pkg-add
              ./test/integration release/*.iso boot --no-preview --memory 8192 --timeout 1800
            '
      - name: Install test logs
        if: failure()
        run: |
          sudo chown -R "$(id -u):$(id -g)" test-runs 2>/dev/null || true
          find test-runs -maxdepth 2 -type f \( -name "*.log" -o -name "*.txt" \) | head -20
          for f in $(find test-runs -maxdepth 2 -type f -name "*.log" | head -4); do echo "== $f"; tail -60 "$f"; done
